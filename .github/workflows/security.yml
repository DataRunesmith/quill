name: Security scanning

on:
  push:
    branches: [main, 'security/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check "semgrep==1.185.0"
      - name: Remove stale Semgrep report
        run: rm -f semgrep.sarif
      - name: Run Semgrep
        id: semgrep_scan
        env:
          SEMGREP_SEND_METRICS: "off"
        run: semgrep scan --config p/default --sarif --output semgrep.sarif .
      - name: Validate Semgrep SARIF report
        if: ${{ !cancelled() && steps.semgrep_scan.outcome == 'success' }}
        shell: bash
        run: test -s semgrep.sarif
      - name: Preserve Semgrep SARIF
        id: semgrep_artifact
        if: ${{ always() && steps.semgrep_scan.outcome == 'success' && hashFiles('semgrep.sarif') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sarif-semgrep
          path: semgrep.sarif
          if-no-files-found: error
          retention-days: 1
      - name: Summarize semgrep findings when SARIF upload is unavailable
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' && (steps.semgrep_scan.outcome == 'failure' || steps.semgrep_artifact.outcome == 'failure' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true)) }}
        env:
          SARIF_FILE: semgrep.sarif
        run: |
          jq -r '
            [.runs[].results[]?] |
            if length == 0 then "No findings reported."
            else .[] |
              (if any(.suppressions[]?; .kind == "inSource") then "Suppressed" else "Finding" end) as $kind |
              ([.locations[]?.physicalLocation? | select(.artifactLocation.uri != null) | "\(.artifactLocation.uri):\(.region.startLine // 1)"] | join(", ") | @json) as $where |
              "\($kind): \(.ruleId // "unknown") at \($where)"
            end
          ' "$SARIF_FILE"
  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove stale Trivy report
        run: rm -f trivy.sarif
      - name: Run Trivy
        id: trivy_scan
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          version: v0.70.0
          scanners: vuln,misconfig,secret,license
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          cache: false
      - name: Validate Trivy SARIF report
        if: ${{ !cancelled() && steps.trivy_scan.outcome == 'success' }}
        shell: bash
        run: test -s trivy.sarif
      - name: Preserve Trivy SARIF
        id: trivy_artifact
        if: ${{ always() && steps.trivy_scan.outcome == 'success' && hashFiles('trivy.sarif') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sarif-trivy
          path: trivy.sarif
          if-no-files-found: error
          retention-days: 1
      - name: Summarize trivy-filesystem findings when SARIF upload is unavailable
        if: ${{ !cancelled() && hashFiles('trivy.sarif') != '' && (steps.trivy_scan.outcome == 'failure' || steps.trivy_artifact.outcome == 'failure' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true)) }}
        env:
          SARIF_FILE: trivy.sarif
        run: |
          jq -r '
            [
              .runs[] as $run
              | $run.results[]?
              | . as $result
              | {
                  result: $result,
                  rule: (
                    ($run.tool.driver.rules // [])
                    | map(select(.id == $result.ruleId))
                    | .[0] // {}
                  )
                }
            ] as $items
            | if ($items | length) == 0 then "No findings reported."
              else
                (
                  $items[] |
                  (.rule.name // "UnknownIssue") as $rule_name |
                  (.rule.properties.tags // []) as $tags |
                  (.result.ruleId // "unknown") as $rule_id |
                  ([ $tags[]? | ascii_upcase | select(. == "CRITICAL" or . == "HIGH" or . == "MEDIUM" or . == "LOW" or . == "UNKNOWN") ] | .[0] // .result.level // "unknown") as $severity |
                  ([.result.locations[]?.physicalLocation? | select(.artifactLocation.uri != null) | "\(.artifactLocation.uri):\(.region.startLine // 1)"] | join(", ") | @json) as $where |
                  (if $rule_name == "Secret" then "Secret"
                   elif $rule_name == "Misconfiguration" then "Misconfiguration"
                   elif $rule_name == "License" then "License"
                   elif ($rule_name | contains("Vulnerability")) or ($rule_id | startswith("CVE-") or startswith("GHSA-")) then "Vulnerability"
                   else "Finding" end) as $kind |
                  if $kind == "Secret" then
                    "Secret [\($severity)] \($rule_id) at \($where): match redacted"
                  else
                    (.result.message.text // "No detail") as $details |
                    "\($kind) [\($severity)] \($rule_id) at \($where): \($details | @json)"
                  end
                )
              end
          ' "$SARIF_FILE"
  publish-sarif:
    name: Publish SARIF results
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
    needs: [semgrep, trivy]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out scanned revision for SARIF fingerprints
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download scanner reports
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sarif-*
          path: ${{ runner.temp }}/sarif-artifacts
          merge-multiple: true
      - name: Validate expected SARIF artifacts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -eu
          if [ "${{ needs.semgrep.result }}" = "success" ]; then test -s "$RUNNER_TEMP/sarif-artifacts/semgrep.sarif"; fi
          if [ "${{ needs.trivy.result }}" = "success" ]; then test -s "$RUNNER_TEMP/sarif-artifacts/trivy.sarif"; fi
      - name: Upload Semgrep results
        if: ${{ !cancelled() && needs.semgrep.result == 'success' }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: ${{ runner.temp }}/sarif-artifacts/semgrep.sarif
          checkout_path: ${{ github.workspace }}
          category: semgrep
      - name: Upload Trivy results
        if: ${{ !cancelled() && needs.trivy.result == 'success' }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: ${{ runner.temp }}/sarif-artifacts/trivy.sarif
          checkout_path: ${{ github.workspace }}
          category: trivy-filesystem
