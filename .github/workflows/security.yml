name: Security scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check "semgrep==1.185.0"
      - name: Remove stale Semgrep report
        run: rm -f semgrep.sarif
      - name: Run Semgrep
        id: semgrep_scan
        env:
          SEMGREP_SEND_METRICS: "off"
        run: semgrep scan --config p/default --sarif --output semgrep.sarif .
      - name: Upload Semgrep results
        if: ${{ success() && hashFiles('semgrep.sarif') != '' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]')) }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Summarize semgrep findings when SARIF upload is unavailable
        if: ${{ success() && steps.semgrep_scan.outcome == 'success' && hashFiles('semgrep.sarif') != '' && github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]') }}
        env:
          SARIF_FILE: semgrep.sarif
        run: |
          jq -r '
            [.runs[].results[]?] |
            if length == 0 then "No findings reported."
            else .[] |
              (if any(.suppressions[]?; .kind == "inSource") then "Suppressed" else "Finding" end) as $kind |
              ([.locations[]?.physicalLocation? | select(.artifactLocation.uri != null) | "\(.artifactLocation.uri):\(.region.startLine // 1)"] | join(", ") | @json) as $where |
              "\($kind): \(.ruleId // "unknown") at \($where)"
            end
          ' "$SARIF_FILE"
  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove stale Trivy report
        run: rm -f trivy.sarif
      - name: Run Trivy
        id: trivy_scan
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          version: v0.70.0
          scanners: vuln,misconfig,secret,license
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          cache: false
      - name: Upload Trivy results
        if: ${{ success() && hashFiles('trivy.sarif') != '' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]')) }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy.sarif
          category: trivy-filesystem
      - name: Summarize trivy-filesystem findings when SARIF upload is unavailable
        if: ${{ success() && steps.trivy_scan.outcome == 'success' && hashFiles('trivy.sarif') != '' && github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]') }}
        env:
          SARIF_FILE: trivy.sarif
        run: |
          jq -r '
            [.runs[].results[]? | select((.ruleId // "") | startswith("CVE-"))] |
            if length == 0 then "No vulnerability findings reported."
            else .[] |
              (.properties.severity // .level // "unknown") as $severity |
              (.message.text // "No vulnerability details supplied") as $details |
              "\($severity): \(.ruleId // "unknown") \($details | @json)"
            end
          ' "$SARIF_FILE"
